events:

  - event_id: HORMUZ_TRANSIT_001

    crisis_cluster:
      cluster_id: GULF_ENERGY_SHOCK
      cluster_name: Gulf Energy Supply Shock

    event_category: transit_disruption

    trigger_event:
      name: "Strait of Hormuz closure"
      actor: "Iran"
      trigger_type: "maritime chokepoint disruption"

    detection_keywords:
        high_confidence:
          - "Strait of Hormuz"
          - "Hormuz closure"
          - "Hormuz disruption"
          - "shipping lane closure"
        medium_confidence:
          - "naval blockade"
          - "shipping disruption"
          - "war-risk insurance"
          - "tanker seizure"
          - "maritime threat"
        contextual:
          - "oil tanker"
          - "Gulf shipping"
          - "maritime tensions"
          - "energy transit disruption"
          - "shipping insurance premiums"
         # - "Iran" # added for better detection of Iran-related transit disruptions

    dependency_type:
      - "Transit Chokepoint Dependency"
      - "Gulf-origin Fuel Dependency"

    primary_disruption:
      affected_systems:
        - "oil shipping"
        - "LNG shipping"
        - "maritime logistics"

    impact_domains:

      energy_security:
        - "Fuel Import Disruption"
        - "LNG Supply Stress"
        - "Load Shedding Risk"

      macroeconomic:
        - "Inflationary Pressure"
        - "FX Reserve Stress"
        - "Higher Import Bill"

      agriculture:
        - "Fertilizer Cost Increase"
        - "Food Inflation Risk"

      trade_exports:
        - "Higher Export Insurance Premiums"
        - "Shipping Cost Increase"

      financial_markets:
        - "Stock Market Volatility"

      logistics:
        - "Inland Freight Cost Escalation"

      industrial:
        - "Higher Production Costs"

    global_effects:

      immediate:
        - "Oil Price Spike"
        - "LNG Spot Market Surge"
        - "War Risk Insurance Increase"
        - "Freight Cost Escalation"

      progressive:
        - "Shipping Delays"
        - "Global Energy Market Volatility"
        - "Supply Uncertainty"

    pakistan_exposure:

      strategic_dependency:
        - "High Dependence on Gulf-Origin Energy Imports"

      immediate_effects:
        - "Higher Fuel Import Costs"
        - "Market Panic"
        - "Currency Pressure"

      delayed_effects:
        - "Fuel Shortages"
        - "Industrial Slowdown"
        - "Electricity Tariff Pressure"

    commodity_exposure:

      crude_oil:
        exposure_level: "high"

      lng:
        exposure_level: "high"

      refined_fuels:
        exposure_level: "high"

    cascade_effects:

      first_order:
        - "Oil Price Spike"
        - "LNG Spot Market Surge"
        - "War Risk Insurance Increase"

      second_order:
        - "Higher Fuel Import Costs"
        - "Shipping Cost Increase"
        - "FX Reserve Stress"

      third_order:
        - "Inflationary Pressure"
        - "Industrial Slowdown"
        - "Food Inflation Risk"

    escalation_indicators:

      high_confidence:
        - "Tanker Attack"
        - "Naval Interdiction"
        - "Mine Deployment"

      medium_confidence:
        - "War Risk Insurance Spike"
        - "Military Mobilization"

      monitoring:
        - "Diplomatic Breakdown"

    forecast_scenarios:

      most_likely:
        description: "Short-term shipping disruption and higher energy prices."

      severe_case:
        description: "Extended Hormuz closure causing major fuel import disruption and inflationary pressure."

      best_case:
        description: "Rapid diplomatic de-escalation with limited market impact."

    scenario_confidence:

      most_likely: 70

      severe_case: 20

      best_case: 10
    
    transmission_timeline:

      market_reaction: "instant"
      import_cost_pressure: "immediate"
      physical_supply_stress: "delayed"
      industrial_impact: "progressive"

    persistence:
      expected_duration: "medium_to_long"

    mitigation_capacity:
      - "strategic Fuel Reserves"
      - "Fuel Rationing"
      - "Emergency LNG Procurement"

    severity: "very_high"

    severity_drivers:

      dependency_concentration: "extreme"
      import_criticality: "critical"
      substitutability: "low"
      macroeconomic_exposure: "severe"
      escalation_risk: "extreme"

    escalation_potential: "severe"

   
